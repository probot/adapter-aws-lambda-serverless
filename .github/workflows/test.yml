name: Test
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

jobs:
  test_matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep newest first so lint runs on the latest version.
        node_version:
          - 26
          - 24
          - 22
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
        if: ${{ strategy.job-index == 0 }}
  test:
    runs-on: ubuntu-latest
    needs: test_matrix
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.test_matrix.result }}" = "success"
